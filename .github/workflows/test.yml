name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Omarchy's system Python, which runs the backend, and the next release.
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile backend
        run: python -m py_compile scripts/openvpn-plugin
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null
